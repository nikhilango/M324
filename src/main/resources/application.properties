# H2 In-Memory Datenbank Konfiguration
spring.datasource.url=jdbc:h2:mem:ticketdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Spring Web Port
server.port=8081

# External Service Configuration - CHANGED FOR DOCKER
employee.service.url=http://host.docker.internal:8082/api/employees
