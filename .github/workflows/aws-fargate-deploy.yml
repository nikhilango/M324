name: AWS Fargate Deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push-aws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Mitarbeiterverwaltung
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/nikola/mitarbeiter-backend:latest ./Code/mitarbeiterverwaltung
          docker push $ECR_REGISTRY/nikola/mitarbeiter-backend:latest

      - name: Build and Push Ticketverwaltung
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/nikola/ticket-backend:latest . 
          docker push $ECR_REGISTRY/nikola/ticket-backend:latest

      - name: Update ECS Service Mitarbeiterverwaltung
        run: |
          aws ecs update-service --cluster AWS_Fargate_m324 --service mitarbeiter-service --force-new-deployment

      - name: Update ECS Service Ticketverwaltung
        run: |
          aws ecs update-service --cluster AWS_Fargate_m324 --service ticket-service --force-new-deployment
