name: Java CI/CD Pipeline (Final Version)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feature/*"]
  workflow_dispatch:

jobs:
  test-mitarbeiterverwaltung:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn clean verify --batch-mode
        working-directory: Code/mitarbeiterverwaltung

      - name: Install Newman
        run: npm install -g newman

      - name: Start Mitarbeiterverwaltung
        run: |
          mvn spring-boot:run &
          sleep 30
        working-directory: Code/mitarbeiterverwaltung

      - name: Run Postman Tests
        run: newman run postman/mitarbeiterverwaltung.postman_collection.json -e postman/environment.json --reporters cli,junit --reporter-junit-export newman-results-mitarbeiter.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: |
            **/target/surefire-reports/TEST-*.xml
            newman-results-mitarbeiter.xml

  test-ticketverwaltung:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Start Mitarbeiterverwaltung
        run: |
          mvn clean verify --batch-mode -DskipTests
          mvn spring-boot:run -DskipTests &
        working-directory: Code/mitarbeiterverwaltung

      - name: Build Ticketverwaltung
        run: mvn clean verify --batch-mode

      - name: Install Newman
        run: npm install -g newman

      - name: Start Ticketverwaltung
        run: |
          mvn spring-boot:run &
          sleep 45

      - name: Run Postman Tests
        run: |
          newman run postman/mitarbeiterverwaltung.postman_collection.json -e postman/environment.json --export-globals globals.json
          newman run postman/ticketverwaltung.postman_collection.json -e postman/environment.json --globals globals.json --env-var "baseUrl=http://localhost:8081" --reporters cli,junit --reporter-junit-export newman-results-ticket.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: |
            **/target/surefire-reports/TEST-*.xml
            newman-results-ticket.xml

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-mitarbeiterverwaltung, test-ticketverwaltung]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login bei DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Mitarbeiterverwaltung
        uses: docker/build-push-action@v5
        with:
          context: ./Code/mitarbeiterverwaltung
          file: ./Code/mitarbeiterverwaltung/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mitarbeiterverwaltung:latest

      - name: Build and Push Ticketverwaltung
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ticketverwaltung:latest
