name: Java CI/CD Pipeline (Final Version)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "feature/*" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Programmed Tests
      run: mvn clean verify --batch-mode

    - name: Start App for Externally Controlled Test
      run: |
        nohup java -jar target/*.jar &
        sleep 15

    - name: Run System Test (External Smoke Test)
      run: |
        http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/tickets)
        if [ "$http_code" -eq 200 ]; then
          echo "SUCCESS: System-Test bestanden (HTTP 200)"
        else
          echo "FAILURE: System-Test fehlgeschlagen (HTTP $http_code)"
          exit 1
        fi

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: always()
      with:
        report_paths: '**/target/surefire-reports/TEST-*.xml'

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: target/*.jar
        retention-days: 5
