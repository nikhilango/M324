name: Java CI/CD Pipeline (Variante 3)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feature/*"]
  workflow_dispatch:

jobs:
  test-mitarbeiterverwaltung:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn clean verify --batch-mode
        working-directory: Code/mitarbeiterverwaltung

      - name: Install Newman
        run: npm install -g newman

      - name: Start Mitarbeiterverwaltung
        run: |
          mvn spring-boot:run &
          sleep 30
        working-directory: Code/mitarbeiterverwaltung

      - name: Run Postman Tests
        run: newman run postman/mitarbeiterverwaltung.postman_collection.json -e postman/environment.json --reporters cli,junit --reporter-junit-export newman-results-mitarbeiter.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"

  test-ticketverwaltung:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Start Mitarbeiterverwaltung
        run: |
          mvn clean verify --batch-mode -DskipTests
          mvn spring-boot:run -DskipTests &
        working-directory: Code/mitarbeiterverwaltung

      - name: Build Ticketverwaltung
        run: mvn clean verify --batch-mode

      - name: Install Newman
        run: npm install -g newman

      - name: Start Ticketverwaltung
        run: |
          mvn spring-boot:run &
          sleep 45

      - name: Run Postman Tests
        run: |
          # 1. Create employee and capture ID
          newman run postman/mitarbeiterverwaltung.postman_collection.json -e postman/environment.json --export-globals globals.json
          # 2. Run ticket tests using that ID
          newman run postman/ticketverwaltung.postman_collection.json -e postman/environment.json --globals globals.json --env-var "baseUrl=http://localhost:8081" --reporters cli,junit --reporter-junit-export newman-results-ticket.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"
