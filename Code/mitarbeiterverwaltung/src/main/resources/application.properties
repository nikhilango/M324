# H2 In-Memory Datenbank Konfiguration
# Die Datenbank existiert nur im Speicher, solange die Anwendung läuft.
spring.datasource.url=jdbc:h2:mem:mitarbeiterdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate Konfiguration
# ddl-auto: create-drop - Erstellt das Schema beim Start und löscht es beim Beenden.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Spring Web Port
server.port=8080